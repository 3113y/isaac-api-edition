{% extends "base.html" %}

{% block tabs %}
  {{ super() }}
  <div class="isaac-profile-bar" id="environment-profile" role="region" aria-label="Documentation profile controls">
    <div class="md-grid isaac-profile-inner">
      <div class="profile-control" id="base-version-control" role="group" aria-label="Base API version">
        <div class="profile-pill-group" title="Base API version">
          <span class="profile-pill-indicator" aria-hidden="true"></span>
          <button type="button" class="profile-pill" data-game="rep" aria-pressed="false" aria-label="REP">REP</button>
          <button type="button" class="profile-pill" data-game="rep+" aria-pressed="false" aria-label="REP plus">REP+</button>
        </div>
      </div>
      <div class="profile-control" id="extension-control" role="group" aria-label="API extension">
        <div class="profile-pill-group" title="Documentation source">
          <span class="profile-pill-indicator" aria-hidden="true"></span>
          <button type="button" class="profile-pill" data-extension="" aria-pressed="false">Original</button>
          <button type="button" class="profile-pill" data-extension-toggle="rgon" aria-pressed="false">RGON</button>
        </div>
      </div>
      <span class="isaac-spacer"></span>
      <div class="profile-control" id="language-switch" role="group" aria-label="Documentation language">
        <div class="profile-pill-group" title="Documentation language">
          <span class="profile-pill-indicator" aria-hidden="true"></span>
          <button type="button" class="profile-pill" data-language-toggle="zh" aria-pressed="false">中文</button>
          <button type="button" class="profile-pill" data-language-toggle="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
