name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate unified Original and RGON documentation
        run: |
          python scripts/build_overlay_docs.py \
            --source-docs docs \
            --base-en docs/en \
            --base-zh docs/zh \
            --rgon-zh docs/rgon/zh \
            --rgon-plus-en docs/rgon-plus/en \
            --output .generated-docs
      - name: Generate expandable API navigation
        run: |
          python scripts/build_mkdocs_config.py \
            --template mkdocs.yml \
            --enum-source .generated-docs/en/enums \
            --output .generated-mkdocs.yml
      - run: mkdocs build --config-file .generated-mkdocs.yml --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
